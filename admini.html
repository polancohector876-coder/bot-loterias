<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Maestro Admin - SACATE SPORT</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
        import { getFirestore, doc, onSnapshot, setDoc, getDoc, collection } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBN9HbGRgVl0NEVX0zjxMz9qrssmDAWKco",
            authDomain: "banca-hp.firebaseapp.com",
            projectId: "banca-hp",
            storageBucket: "banca-hp.firebasestorage.app",
            messagingSenderId: "78718057679",
            appId: "1:78718057679:web:002f4ac81022a5602acbba",
            measurementId: "G-YZ7EX6YFQE"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        window.db = db;
        window.firebaseFirestore = { doc, onSnapshot, setDoc, getDoc, collection };

        // Escuchar tickets en tiempo real
        onSnapshot(collection(db, "tickets"), (snapshot) => {
            window.todosLosTickets = [];
            snapshot.forEach(docSnap => window.todosLosTickets.push(docSnap.data()));
            if (typeof window.renderizarTodo === 'function') window.renderizarTodo();
        });

        // Escuchar terminales registradas
        onSnapshot(collection(db, "terminales"), (snapshot) => {
            window.todasLasTerminales = [];
            snapshot.forEach(docSnap => window.todasLasTerminales.push(docSnap.data()));
            if (typeof window.renderizarTodo === 'function') window.renderizarTodo();
        });

        // Escuchar estado de bloqueo
        onSnapshot(doc(db, "banca", "estadoMaestro"), (docSnap) => {
            window.estadoMaestro = docSnap.exists() ? docSnap.data() : { bancaBloqueadaMaestro: false, dispositivosBloqueados: [] };
            if (typeof window.renderizarTodo === 'function') window.renderizarTodo();
        });
    </script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
        body { background-color: #121212; color: #fff; display: flex; justify-content: center; min-height: 100vh; padding: 10px; }
        .admin-card { width: 100%; max-width: 700px; background: #1e1e1e; border: 1px solid #333; border-radius: 8px; overflow: hidden; display: flex; flex-direction: column; }
        .header { background: #00bcd4; color: #000; padding: 12px 15px; display: flex; justify-content: space-between; align-items: center; }
        .header h2 { font-size: 18px; font-weight: bold; }
        .btn-volver { background: #000; color: #fff; border: none; padding: 6px 12px; border-radius: 4px; font-weight: bold; cursor: pointer; text-decoration: none; font-size: 12px; }
        
        .nav-tabs { display: grid; grid-template-columns: repeat(4, 1fr); background: #252525; border-bottom: 1px solid #444; }
        .tab-btn { background: none; border: none; color: #bbb; padding: 12px 5px; font-size: 11px; font-weight: bold; cursor: pointer; text-align: center; }
        .tab-btn.active { background: #111; color: #00bcd4; border-bottom: 2px solid #00bcd4; }

        .content { padding: 15px; flex: 1; overflow-y: auto; max-height: 82vh; }
        
        .card-terminal-monitoreo { background: #252525; border: 1px solid #444; border-radius: 6px; padding: 12px; margin-bottom: 12px; }
        .terminal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; border-bottom: 1px solid #333; padding-bottom: 6px; }
        
        .grid-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-bottom: 8px; }
        .stat-box { background: #181818; padding: 8px; border-radius: 4px; text-align: center; border: 1px solid #333; }
        .stat-box span { font-size: 10px; color: #aaa; display: block; }
        .stat-box b { font-size: 13px; color: #00bcd4; }

        .box-cuadre-comision { background: #141414; border: 1px solid #444; border-radius: 6px; padding: 10px; margin-bottom: 8px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; text-align: center; }
        .box-cuadre-comision span { font-size: 10px; color: #bbb; display: block; margin-bottom: 2px; }

        .ticket-item { background: #1c1c1c; border: 1px solid #333; border-radius: 4px; padding: 8px; margin-bottom: 6px; font-size: 11px; }

        .modal { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.85); z-index: 9999; justify-content: center; align-items: center; padding: 10px; flex-direction: column; }
        #ticketToImage { background: #ffffff; width: 320px; padding: 20px; text-align: center; color: #000; box-shadow: 0 4px 10px rgba(0,0,0,0.3); margin-bottom: 15px; border-radius: 4px; }
        #ticketToImage pre { text-align: center; white-space: pre-wrap; word-wrap: break-word; font-family: 'Courier New', Courier, monospace; font-size: 12px; line-height: 1.4; font-weight: bold; }
    </style>
</head>
<body>

<div class="admin-card">
    <div class="header">
        <h2>📍 Monitoreo y Cuadre de Ventas</h2>
        <a href="index.html" class="btn-volver">⬅ Terminal</a>
    </div>

    <div class="nav-tabs">
        <button class="tab-btn active" id="tabBtnMonitoreo" onclick="cambiarTab('monitoreo')">📱 Monitoreo</button>
        <button class="tab-btn" id="tabBtnTickets" onclick="cambiarTab('tickets')">🗂 Todos Tickets</button>
        <button class="tab-btn" id="tabBtnLimites" onclick="cambiarTab('limites')">🛑 Límites/Calientes</button>
        <button class="tab-btn" id="tabBtnResultados" onclick="cambiarTab('resultados')">🏆 Resultados</button>
    </div>

    <!-- PESTAÑA 1: MONITOREO Y COMISIONES -->
    <div class="content" id="panelMonitoreo">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; background:#252525; padding:8px 12px; border-radius:6px;">
            <div>
                <label style="font-size:11px; color:#aaa; font-weight:bold;">📅 FECHA: </label>
                <input type="date" id="filtroFechaMonitoreo" onchange="renderizarTodo()" style="background:#111; color:#00bcd4; border:1px solid #555; padding:5px 8px; border-radius:4px; font-weight:bold;">
            </div>
            <button onclick="ponerFechaHoyMonitoreo()" style="background:#333; color:#fff; border:1px solid #555; padding:5px 10px; border-radius:4px; font-size:11px; cursor:pointer; font-weight:bold;">Hoy</button>
        </div>

        <div id="contenedorMonitoreoTerminales">
            <p style="color:#aaa; text-align:center; padding:20px;">Cargando terminales conectadas...</p>
        </div>
    </div>

    <!-- PESTAÑA 2: AUDITORIA GENERAL DE TICKETS -->
    <div class="content" id="panelTickets" style="display:none;">
        <h3 style="color:#00bcd4; margin-bottom:10px; font-size:15px;">🗂 Auditoría Global de Tickets</h3>
        <div id="resumenVentasGlobal" style="background:#00bcd4; color:#000; padding:10px; border-radius:4px; font-weight:bold; display:flex; justify-content:space-between; margin-bottom:10px;">
            <span>TOTAL VENTAS GENERAL:</span>
            <span id="txtTotalPeriodo">$0.00</span>
        </div>
        <div id="listaTicketsAdmin"><p style="color:#aaa; text-align:center; padding:20px;">Cargando tickets...</p></div>
    </div>

    <!-- PESTAÑA 3: CONFIGURAR LÍMITES -->
    <div class="content" id="panelLimites" style="display:none;">
        <h3 style="color:#00bcd4; margin-bottom:15px;">🛑 Configurar Límites y Calientes</h3>
        <div style="background:#252525; padding:15px; border-radius:6px; display:flex; flex-direction:column; gap:10px;">
            <div>
                <label style="font-size:12px; color:#aaa;">Límite Punto / Quiniela ($):</label>
                <input type="number" id="inSueltoMax" style="width:100%; padding:8px; background:#111; border:1px solid #555; color:#fff; border-radius:4px; margin-top:4px;">
            </div>
            <div>
                <label style="font-size:12px; color:#aaa;">Límite Palé ($):</label>
                <input type="number" id="inPaleMax" style="width:100%; padding:8px; background:#111; border:1px solid #555; color:#fff; border-radius:4px; margin-top:4px;">
            </div>
            <div>
                <label style="font-size:12px; color:#aaa;">Límite Tripleta ($):</label>
                <input type="number" id="inTripletaMax" style="width:100%; padding:8px; background:#111; border:1px solid #555; color:#fff; border-radius:4px; margin-top:4px;">
            </div>
            <div>
                <label style="font-size:12px; color:#aaa;">Números / Palés Bloqueados (Separados por coma):</label>
                <input type="text" id="inCalientes" placeholder="Ej: 7788, 1234, 99" style="width:100%; padding:8px; background:#111; border:1px solid #555; color:#fff; border-radius:4px; margin-top:4px;">
            </div>
            <button onclick="guardarLimitesAdmin()" style="margin-top:10px; padding:12px; background:#4caf50; color:#fff; border:none; border-radius:4px; font-weight:bold; cursor:pointer;">💾 Guardar Límites de Apuesta</button>
        </div>
    </div>

    <!-- PESTAÑA 4: RESULTADOS -->
    <div class="content" id="panelResultados" style="display:none;">
        <h3 style="color:#00bcd4; margin-bottom:15px;">🏆 Resultados</h3>
        <p style="color:#aaa;">Visualización de sorteos en vivo.</p>
    </div>
</div>

<!-- MODAL VISOR TICKET -->
<div class="modal" id="modalVisor">
    <div id="ticketToImage"><pre id="receiptContent"></pre></div>
    <div style="width: 320px; display: flex; flex-direction: column; gap: 8px;">
        <button style="padding:12px; background:#4caf50; color:white; border:none; font-weight:bold; cursor:pointer; border-radius:4px;" onclick="compartirImagen()">📲 Compartir / Reenviar Ticket</button>
        <button style="padding:10px; background:#333; color:white; border:none; cursor:pointer; border-radius:4px;" onclick="cerrarVisor()">Cerrar</button>
    </div>
</div>

<script>
    window.todosLosTickets = [];
    window.todasLasTerminales = [];
    window.estadoMaestro = { bancaBloqueadaMaestro: false, dispositivosBloqueados: [] };

    document.getElementById('filtroFechaMonitoreo').value = new Date().toISOString().split('T')[0];

    function ponerFechaHoyMonitoreo() {
        document.getElementById('filtroFechaMonitoreo').value = new Date().toISOString().split('T')[0];
        renderizarTodo();
    }

    window.renderizarTodo = function() {
        renderizarMonitoreo();
        renderizarTicketsGlobal();
    };

    function renderizarMonitoreo() {
        let cont = document.getElementById('contenedorMonitoreoTerminales');
        let fecha = document.getElementById('filtroFechaMonitoreo').value;
        let terms = window.todasLasTerminales || [];
        let tickets = window.todosLosTickets || [];
        let bloqueados = window.estadoMaestro.dispositivosBloqueados || [];

        if (terms.length === 0) {
            cont.innerHTML = '<p style="color:#aaa; text-align:center; padding:20px;">No hay terminales registradas.</p>';
            return;
        }

        cont.innerHTML = terms.map(term => {
            let estaBloq = bloqueados.includes(term.nombre);
            let pctComision = term.comision !== undefined ? parseFloat(term.comision) : 0;

            let ticketsVendedor = tickets.filter(t => {
                let coincideVendedor = (t.vendedor === term.nombre);
                if (!coincideVendedor) return false;
                if (!fecha) return true;
                let d = new Date(t.timestamp || 0);
                let yyyy = d.getFullYear();
                let mm = String(d.getMonth() + 1).padStart(2, '0');
                let dd = String(d.getDate()).padStart(2, '0');
                return `${yyyy}-${mm}-${dd}` === fecha;
            });

            ticketsVendedor.sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));

            let totalVendidoBruto = 0;
            let ticketsValidos = 0;
            let ticketsCancelados = 0;

            ticketsVendedor.forEach(t => {
                if (t.cancelado) {
                    ticketsCancelados++;
                } else {
                    ticketsValidos++;
                    totalVendidoBruto += (parseFloat(t.total) || 0);
                }
            });

            let gananciaVendedor = totalVendidoBruto * (pctComision / 100);
            let netoParaBanca = totalVendidoBruto - gananciaVendedor;

            let ultimosTicketsHTML = ticketsVendedor.slice(0, 3).map(t => `
                <div class="ticket-item" style="${t.cancelado ? 'opacity:0.5; text-decoration:line-through;' : ''}">
                    <div style="display:flex; justify-content:space-between;">
                        <b>Ticket #${t.id}</b>
                        <span style="color:${t.cancelado ? '#ff5252' : '#4caf50'}; font-weight:bold;">$${parseFloat(t.total).toFixed(2)}</span>
                    </div>
                    <div style="color:#aaa; font-size:10px;">${t.fecha}</div>
                </div>
            `).join('');

            return `
                <div class="card-terminal-monitoreo" style="border-left: 4px solid ${estaBloq ? '#c62828' : '#00bcd4'};">
                    <div class="terminal-header">
                        <div>
                            <span style="font-size:15px; font-weight:bold; color:${estaBloq ? '#ff5252' : '#00bcd4'};">📱 ${term.nombre}</span>
                            <span style="font-size:10px; background:${estaBloq ? '#c62828' : '#2e7d32'}; color:#fff; padding:2px 5px; border-radius:3px; margin-left:6px;">
                                ${estaBloq ? 'BLOQUEADO' : 'EN LÍNEA'}
                            </span>
                        </div>
                        <div style="display:flex; gap:6px;">
                            <button onclick="asignarComisionPrompt('${term.nombre}', ${pctComision})" style="background:#ff9800; color:#000; border:none; padding:5px 8px; border-radius:4px; font-weight:bold; cursor:pointer; font-size:11px;">
                                🏷 % Comisión (${pctComision}%)
                            </button>
                            <button onclick="toggleBloqueoTerminal('${term.nombre}')" style="background:${estaBloq ? '#2e7d32' : '#c62828'}; color:#fff; border:none; padding:5px 8px; border-radius:4px; font-weight:bold; cursor:pointer; font-size:11px;">
                                ${estaBloq ? '🔓' : '🔒'}
                            </button>
                        </div>
                    </div>

                    <!-- CAJAS DE CUADRE FINANCIERO -->
                    <div class="box-cuadre-comision">
                        <div>
                            <span>VENTA BRUTA</span>
                            <b style="color:#fff; font-size:13px;">$${totalVendidoBruto.toFixed(2)}</b>
                        </div>
                        <div>
                            <span>SU COMISIÓN (${pctComision}%)</span>
                            <b style="color:#ff9800; font-size:13px;">-$${gananciaVendedor.toFixed(2)}</b>
                        </div>
                        <div style="background:#222; border-radius:4px; padding:2px;">
                            <span style="color:#00bcd4; font-weight:bold;">DEBE ENTREGAR</span>
                            <b style="color:#4caf50; font-size:14px;">$${netoParaBanca.toFixed(2)}</b>
                        </div>
                    </div>

                    <div class="grid-stats">
                        <div class="stat-box">
                            <span>TICKETS ACTIVOS</span>
                            <b>${ticketsValidos}</b>
                        </div>
                        <div class="stat-box">
                            <span>ANULADOS</span>
                            <b style="color:#ff5252;">${ticketsCancelados}</b>
                        </div>
                        <div class="stat-box">
                            <span>ÚLTIMO ACCESO</span>
                            <b style="font-size:10px; color:#aaa;">${term.ultimoAcceso ? term.ultimoAcceso.split(',')[1] || term.ultimoAcceso : 'Hoy'}</b>
                        </div>
                    </div>

                    <div style="margin-top:6px;">
                        <span style="font-size:11px; color:#888; font-weight:bold;">ÚLTIMAS JUGADAS:</span>
                        <div style="margin-top:4px;">
                            ${ultimosTicketsHTML || '<div style="color:#666; font-size:10px; padding:4px 0;">Sin ventas en esta fecha.</div>'}
                        </div>
                    </div>
                </div>
            `;
        }).join('');
    }

    async function asignarComisionPrompt(nombreTerm, comisionActual) {
        let nuevoPorcentaje = prompt(`Asignar porcentaje de comisión a "${nombreTerm}" (ejemplo: 20 para 20%, 30 para 30%):`, comisionActual);
        if (nuevoPorcentaje === null) return;
        
        let pct = parseFloat(nuevoPorcentaje);
        if (isNaN(pct) || pct < 0 || pct > 100) {
            alert("❌ Porcentaje inválido. Debe estar entre 0 y 100.");
            return;
        }

        if (window.db && window.firebaseFirestore) {
            await window.firebaseFirestore.setDoc(window.firebaseFirestore.doc(window.db, "terminales", nombreTerm), {
                comision: pct
            }, { merge: true });
            alert(`✅ Comisión de ${pct}% asignada a ${nombreTerm}`);
        }
    }

    function renderizarTicketsGlobal() {
        let cont = document.getElementById('listaTicketsAdmin');
        let fecha = document.getElementById('filtroFechaMonitoreo').value;
        let tickets = window.todosLosTickets || [];

        tickets.sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));

        let filtrados = tickets.filter(t => {
            if (!fecha) return true;
            let d = new Date(t.timestamp || 0);
            let yyyy = d.getFullYear();
            let mm = String(d.getMonth() + 1).padStart(2, '0');
            let dd = String(d.getDate()).padStart(2, '0');
            return `${yyyy}-${mm}-${dd}` === fecha;
        });

        let totalPeriodo = 0;
        filtrados.forEach(t => { if (!t.cancelado) totalPeriodo += (parseFloat(t.total) || 0); });
        document.getElementById('txtTotalPeriodo').innerText = `$${totalPeriodo.toFixed(2)}`;

        if (filtrados.length === 0) {
            cont.innerHTML = '<p style="color:#aaa; text-align:center; padding:20px;">No hay tickets en esta fecha.</p>';
            return;
        }

        cont.innerHTML = filtrados.map(t => `
            <div class="ticket-item" style="${t.cancelado ? 'opacity:0.6; text-decoration:line-through;' : ''}">
                <div style="display:flex; justify-content:space-between; align-items:center;">
                    <b>Ticket #${t.id} - ${t.vendedor || 'Terminal'}</b>
                    <button onclick="abrirVisorTicket(${t.id})" style="background:#00bcd4; color:#000; border:none; padding:2px 6px; border-radius:3px; font-size:10px; font-weight:bold; cursor:pointer;">👁 Ver</button>
                </div>
                <div style="color:#aaa; font-size:10px;">${t.fecha} | Total: <b>$${parseFloat(t.total).toFixed(2)}</b></div>
            </div>
        `).join('');
    }

    async function toggleBloqueoTerminal(nombreTerm) {
        let bloqueados = window.estadoMaestro.dispositivosBloqueados || [];
        if (bloqueados.includes(nombreTerm)) {
            bloqueados = bloqueados.filter(x => x !== nombreTerm);
        } else {
            bloqueados.push(nombreTerm);
        }

        if (window.db && window.firebaseFirestore) {
            await window.firebaseFirestore.setDoc(window.firebaseFirestore.doc(window.db, "banca", "estadoMaestro"), {
                bancaBloqueadaMaestro: window.estadoMaestro.bancaBloqueadaMaestro || false,
                dispositivosBloqueados: bloqueados
            }, { merge: true });
        }
    }

    function abrirVisorTicket(id) {
        let t = (window.todosLosTickets || []).find(x => x.id === id);
        if (!t) return;

        let texto = `================================\n          SACATE SPORT          \n         ** ORIGINAL **         \n================================\n Fecha: ${t.fecha}\n Vendedor: ${t.vendedor}\n Ticket #: ${t.id}\n--------------------------------\n`;
        (t.items || []).forEach(i => { texto += ` Lotería: ${i.lot}\n Núm: ${i.j}      Monto: $${j.monto || j.amount || j.valor || j.total || "0.00"}\n\n`; });
        texto += `--------------------------------\n       TOTAL A PAGAR: $${parseFloat(t.total).toFixed(2)}\n================================\n            PREMIOS:            \n      1ra:60 | 2da:24 | 3ra:12    \n    PALÉ: 1300 | TRIPLETA: 10000  \n================================\n     ¡SIN TICKET NO SE PAGA!    \n================================`;

        document.getElementById('receiptContent').innerText = texto;
        document.getElementById('modalVisor').style.display = 'flex';
    }

    function cerrarVisor() { document.getElementById('modalVisor').style.display = 'none'; }

    async function compartirImagen() {
        let el = document.getElementById('ticketToImage');
        try {
            const canvas = await html2canvas(el, { scale: 2 });
            canvas.toBlob(async function(blob) {
                let file = new File([blob], 'ticket.png', { type: 'image/png' });
                if (navigator.canShare && navigator.canShare({ files: [file] })) {
                    await navigator.share({ files: [file], title: 'Ticket SACATE SPORT', text: 'Ticket de Venta' });
                } else {
                    let url = URL.createObjectURL(blob);
                    let a = document.createElement('a'); a.href = url; a.download = 'ticket.png'; a.click();
                }
            });
        } catch (e) { alert("Error al generar imagen."); }
    }

    function cambiarTab(tab) {
        document.getElementById('panelMonitoreo').style.display = tab === 'monitoreo' ? 'block' : 'none';
        document.getElementById('panelTickets').style.display = tab === 'tickets' ? 'block' : 'none';
        document.getElementById('panelLimites').style.display = tab === 'limites' ? 'block' : 'none';
        document.getElementById('panelResultados').style.display = tab === 'resultados' ? 'block' : 'none';

        document.getElementById('tabBtnMonitoreo').className = tab === 'monitoreo' ? 'tab-btn active' : 'tab-btn';
        document.getElementById('tabBtnTickets').className = tab === 'tickets' ? 'tab-btn active' : 'tab-btn';
        document.getElementById('tabBtnLimites').className = tab === 'limites' ? 'tab-btn active' : 'tab-btn';
        document.getElementById('tabBtnResultados').className = tab === 'resultados' ? 'tab-btn active' : 'tab-btn';

        if (tab === 'limites') cargarLimitesAdmin();
    }

    async function cargarLimitesAdmin() {
        if (window.db && window.firebaseFirestore) {
            let docSnap = await window.firebaseFirestore.getDoc(window.firebaseFirestore.doc(window.db, "configuracion", "limites_jugadas"));
            if (docSnap.exists()) {
                let d = docSnap.data();
                document.getElementById('inSueltoMax').value = d.sueltoMax || '';
                document.getElementById('inPaleMax').value = d.paleMax || '';
                document.getElementById('inTripletaMax').value = d.tripletaMax || '';
                document.getElementById('inCalientes').value = (d.calientes || []).join(', ');
            }
        }
    }

    async function guardarLimitesAdmin() {
        let cal = document.getElementById('inCalientes').value.split(',').map(s => s.trim()).filter(s => s.length > 0);
        let configObj = {
            sueltoMax: parseFloat(document.getElementById('inSueltoMax').value) || 0,
            paleMax: parseFloat(document.getElementById('inPaleMax').value) || 0,
            tripletaMax: parseFloat(document.getElementById('inTripletaMax').value) || 0,
            calientes: cal
        };

        if (window.db && window.firebaseFirestore) {
            await window.firebaseFirestore.setDoc(window.firebaseFirestore.doc(window.db, "configuracion", "limites_jugadas"), configObj);
            alert("💾 ¡Límites guardados!");
        }
    }
</script>
</body>
</html>
